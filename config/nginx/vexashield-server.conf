# VexaShield - server context
# Installed to /etc/nginx/snippets/vexashield-server.conf and included
# from every server { } block that terminates TLS.

    # Per-IP request throttle: __RATE__ sustained, burst __BURST__ short spikes.
    limit_req  zone=vs_req burst=__BURST__ nodelay;
    limit_req_status 429;

    # Per-IP concurrent connection cap.
    limit_conn vs_conn __CONN__;
    limit_conn_status 429;

    # Do not let clients hold sockets open forever.
    client_body_timeout   15s;
    client_header_timeout 15s;
    keepalive_timeout     30s;
    send_timeout          20s;
    client_max_body_size  64m;
