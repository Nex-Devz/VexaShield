# VexaShield - http context
# Installed to /etc/nginx/conf.d/00-vexashield.conf
# Rate zones are generated by the installer from your chosen limits.

# Addresses listed here are never throttled (control panel / monitoring IPs).
map $binary_remote_addr $vs_limit_key {
    default            $binary_remote_addr;
    ""                 "";
    __WHITELIST_RULES__
}

limit_req_zone  $vs_limit_key zone=vs_req:10m  rate=__RATE__;
limit_conn_zone $vs_limit_key zone=vs_conn:10m;
