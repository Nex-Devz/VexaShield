# VexaShield - Discord ban/unban notifications
# Installed to /etc/fail2ban/action.d/discord-webhook.conf
# Talks to the local CLI so no shell helper is required.

[Definition]

actionstart =
actionstop =
actioncheck =

actionban  = /usr/local/bin/vexashield notify ban <ip> <name> <failures> <bantime>
actionunban = /usr/local/bin/vexashield notify unban <ip> <name> <failures> <bantime>

[Init]
name = default
